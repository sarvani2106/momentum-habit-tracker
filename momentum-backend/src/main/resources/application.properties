spring.application.name=momentum-backend
# 1. Server Configuration
server.port=${PORT:8080}

# 2. PostgreSQL Database Connection (Supports local and cloud like Neon/Render)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. Hibernate (The tool that translates Java to SQL)
# 'update' means Spring will update our database if we change things, but won't delete our tables.
spring.jpa.open-in-view=false

# Google Gemini API Key for AI Coach
gemini.api.key=${GEMINI_API_KEY:your_api_key_here}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework.security=TRACE